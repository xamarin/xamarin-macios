# Stage to verify the project builds successfully on Linux.

parameters:

- name: isPR
  type: boolean

- name: repositoryAlias
  type: string
  default: self

- name: commit
  type: string
  default: HEAD

- name: pool
  type: object
  default:
    vmImage: ubuntu-latest

- name: stageDisplayNamePrefix
  type: string
  default: ''

stages:

- stage: linux_build_verification
  displayName: '${{ parameters.stageDisplayNamePrefix }}Linux Build Verification'
  dependsOn: []
  jobs:
  - job: linux_build
    displayName: 'Build on Linux'
    pool: ${{ parameters.pool }}
    timeoutInMinutes: 60
    steps:
    - template: ../common/checkout.yml
      parameters:
        isPR: ${{ parameters.isPR }}
        repositoryAlias: ${{ parameters.repositoryAlias }}
        commit: ${{ parameters.commit }}

    - bash: |
        set -ex
        ./system-dependencies.sh
      displayName: 'Check system dependencies'
      workingDirectory: $(System.DefaultWorkingDirectory)/$(BUILD_REPOSITORY_TITLE)

    - bash: |
        set -ex
        make -j$(nproc)
      displayName: 'Build on Linux'
      workingDirectory: $(System.DefaultWorkingDirectory)/$(BUILD_REPOSITORY_TITLE)

    - pwsh: |
        $scripts = Join-Path $PWD "tools/devops/automation/scripts"
        $validator = Join-Path $scripts "test-simulator-sharding.ps1"
        if (Test-Path -LiteralPath $validator -PathType Leaf) {
            & $validator
        } else {
            Import-Module (Join-Path $scripts "TestConfiguration.psm1")
            if (Get-Command Split-SimulatorTestMatrix -CommandType Function -ErrorAction SilentlyContinue) {
                throw "The source supports simulator sharding, but its NUnit partition validator is missing."
            }
            Write-Host "Legacy source checkout: simulator sharding and its adapter validator are not present."
        }
      name: validate_shards
      displayName: 'Validate NUnit shard partitions'
      workingDirectory: $(System.DefaultWorkingDirectory)/$(BUILD_REPOSITORY_TITLE)
      retryCountOnTaskFailure: 2
